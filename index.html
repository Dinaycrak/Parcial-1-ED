<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Display 7 Segmentos - Wokwi Integrado</title>
  <link rel="stylesheet" href="src/style/style.css">
</head>
<body>

  <div class="card">
    <h2>Simulador de Display de 7 Segmentos</h2>

    <!-- SIMULADOR WOKWI EMBEBIDO (Muestra Display + ESP32 en vivo) -->
    <div class="wokwi-frame-container">
      <iframe 
        id="wokwi-iframe"
        src="https://wokwi.com/projects/473883644914402305" 
        frameborder="0" 
        scrolling="no">
      </iframe>
    </div>

    <!-- BOTONES RADIALES EN ORDEN (1, 2, 3, 4) -->
    <div class="controls-container">
      <p>Selecciona los bits de entrada:</p>
      <div class="buttons-grid">
        <div class="btn-group">
          <button class="radial-btn" id="btn-1" onclick="toggleBit(0)"></button>
          <span>1</span>
        </div>
        <div class="btn-group">
          <button class="radial-btn" id="btn-2" onclick="toggleBit(1)"></button>
          <span>2</span>
        </div>
        <div class="btn-group">
          <button class="radial-btn" id="btn-3" onclick="toggleBit(2)"></button>
          <span>3</span>
        </div>
        <div class="btn-group">
          <button class="radial-btn" id="btn-4" onclick="toggleBit(3)"></button>
          <span>4</span>
        </div>
      </div>
    </div>

    <div class="info-panel">
      <p>Valor Binario: <strong id="lbl-binario">0000</strong></p>
      <p>Valor Decimal: <strong id="lbl-decimal">0</strong></p>
    </div>
  </div>

  <script src="src/scripts/script.js"></script>
</body>
</html>
